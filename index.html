<!DOCTYPE html>
<html>

<head>
    <title>ATLAS AI</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="app">

    <div class="header">
        <div>
            <h1>ATLAS AI</h1>
            <p>Your personal AI workspace</p>
        </div>

        <span class="status">
            ● Online
        </span>
    </div>


    <div class="main">


        <div class="sidebar">

            <button>Chat</button>
            <button>Memory</button>
            <button>Settings</button>

        </div>



        <div class="chat">


            <div class="message ai">
                Welcome. I am Atlas.
            </div>


            <div class="message user">
                Hello Atlas.
            </div>


            <div class="message ai">
                System ready. Waiting for instructions.
            </div>


        </div>


    </div>



    <div class="input-area">

        <input placeholder="Ask Atlas something...">

        <button>
            Send
        </button>

    </div>


</div>


</body>

</html>
