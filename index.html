<!DOCTYPE html>
<html>
<head>
    <title>My AI Assistant</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            width: 500px;
            margin: auto;
            background: #222;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            width: 80%;
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

<h1>My Private AI Assistant Online</h1>

<p>AI system online.</p>

<input placeholder="Ask something...">

<button>Send</button>

</div>

</body>
</html>
